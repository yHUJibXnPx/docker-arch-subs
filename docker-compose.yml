services:
  sub_store_service:
    cap_add:
      - ${CAP_ADD_SUB_STORE_1}
      - ${CAP_ADD_SUB_STORE_2}
    #cpus: ${CPUS_SUB_STORE}                           # 最多用 1 个核心（4核机器上够用，不会抢占太多）
    cpu_shares: ${CPUS_SHARES_SUB_STORE}               # 优先级中等
    container_name: ${CONTAINER_SUB_STORE}             # 容器名称，来自 .env
    deploy:                                               # 推荐写法
      resources:
        limits:
          cpus: ${CPUS_SUB_STORE}
          memory: ${MEM_LIMIT_SUB_STORE}               # 转码高峰给足空间
        reservations:                                     # 可选：保证最低资源
          cpus: ${CPUS_MIN_SUB_STORE}
          memory: ${MEM_LIMIT_MIN_SUB_STORE}
    environment:                                          # 环境变量，来自 .env
      - SUB_STORE_FRONTEND_BACKEND_PATH=${SUB_STORE_FRONTEND_BACKEND_PATH}
      - TZ=${TIMEZONE}
      - HTTP_PROXY=${PROXY_HTTP}
      - HTTPS_PROXY=${PROXY_HTTPS}
      - ALL_PROXY=${PROXY_ALL}
      - NO_PROXY=${PROXY_NO}
      - http_proxy=${PROXY_HTTP}
      - https_proxy=${PROXY_HTTPS}
      - all_proxy=${PROXY_ALL}
      - no_proxy=${PROXY_NO}
    image: ${IMAGE_SUB_STORE}                          # 镜像名称，来自 .env
    init: ${INIT_SUB_STORE}                            # 解决杀不死的关键
    logging:                                              # 日志配置，来自 .env
      driver: ${LOGGING_DRIVER}
      options:
        max-size: ${LOG_MAX_SIZE}
    #mem_limit: ${MEM_LIMIT_SUB_STORE}                  # 硬限制 512MB（当前用量很低，够日常管理用）
    memswap_limit: ${MEMSWAP_LIMIT_SUB_STORE}          # 禁止额外 swap（保护闪存）
    mem_swappiness: ${MEM_SWAPPINESS_SUB_STORE}        # 全局建议配合这个（已在其他地方有
    networks:
      - network
    platform: ${PLATFORM}                                 # 平台架构，来自 .env
    ports:                                                # 端口映射，来自 .env
      - ${PORT_SUB_STORE_3001}
    privileged: ${PRIVILEGED_SUB_STORE}                # 特权模式，来自 .env
    restart: ${RESTART_POLICY_SUB_STORE}               # 重启策略，来自 .env
    security_opt:
      - ${SECURITY_OPT_SUB_STORE_1}
    stop_signal: ${STOP_SIGNAL_SUB_STORE}              # 用信号强杀 (避开 docker-init 路径问题)
    stop_grace_period: ${STOP_GRACE_PERIOD_SUB_STORE}  # 缩短强杀等待时间
    tty: ${TTY}                                           # 终端模拟，来自 .env
    volumes:                                              # sub-store 挂载路径，来自 .env
      - ${CACHE_SUB_STORE}
      - ${TIMEZONE_VOLUME}
